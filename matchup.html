<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rage Space — Matchup</title>

<link rel="stylesheet" href="style.css"/>

<style>
body { background:#0b0f13; color:#e5e7eb; font-family:system-ui,Segoe UI,Roboto; margin:0; }
.wrap { max-width:700px; margin:auto; padding:16px 12px 96px; }

.timer { font-size:32px; padding:8px 14px; border:1px solid #20242a; border-radius:12px; background:#0f1318; }

.card { margin-top:12px; border:1px solid #20242a; border-radius:16px; overflow:hidden; background:#0f1318; }
.imgBox { aspect-ratio:3/4; background:#111; position:relative; }
.imgBox img { width:100%; height:100%; object-fit:cover; }

/* ===== WINNER DECIDED OVERLAY ===== */
.decidedOverlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:18px;
  font-weight:900;
  letter-spacing:.10em;
  text-transform:uppercase;
  color:rgba(229,231,235,.92);
  background:linear-gradient(135deg, rgba(15,19,24,.92), rgba(15,19,24,.62));
  text-shadow:0 0 12px rgba(0,0,0,.65);
  backdrop-filter: blur(2px);
}
.decidedOverlay small{
  display:block;
  margin-top:10px;
  font-weight:700;
  letter-spacing:.02em;
  opacity:.9;
  text-transform:none;
}

.bar { display:flex; justify-content:space-between; padding:10px 12px; align-items:center; }
.vote { padding:10px 14px; border-radius:12px; background:#131920; border:1px solid #39ff14; color:#39ff14; cursor:pointer; }
.vote:disabled { opacity:.4; cursor:default; }

.topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:10px 0; }
.pill { padding:8px 12px; border-radius:999px; border:1px solid #20242a; background:#0f1318; font-size:14px; }
.btn { padding:8px 12px; border-radius:12px; border:1px solid rgba(57,255,20,.5); background:#0f1318; color:#39ff14; cursor:pointer; }
.btn:disabled { opacity:.4; cursor:default; }

.thumbs { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px; }

.thumb{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  background:#0f1318;
  border:1px solid rgba(57,255,20,.35);
  box-shadow:0 0 8px rgba(57,255,20,.15), inset 0 0 0 1px rgba(57,255,20,.15);
  transition:box-shadow .2s ease, transform .15s ease;
}
.thumb:hover{
  transform:translateY(-1px);
  box-shadow:0 0 14px rgba(57,255,20,.45), 0 0 32px rgba(57,255,20,.25), inset 0 0 0 1px rgba(57,255,20,.4);
}
.thumb.active{
  box-shadow:0 0 18px rgba(57,255,20,.9), 0 0 48px rgba(57,255,20,.55), inset 0 0 0 2px rgba(57,255,20,.9);
}

.thumb-img{ position:relative; width:100%; aspect-ratio:3/4; background:#0b0f13; }
.thumb-img img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.thumb-img img.left{ clip-path:polygon(0% 0%, 100% 0%, 0% 100%); }
.thumb-img img.right{ clip-path:polygon(100% 0%, 100% 100%, 0% 100%); }
/* NEW: when only one side exists, show it full cover */
.thumb-img img.full{ clip-path:none; }

.small{ font-size:12px; opacity:.8; }
.warn{ color:#ffcc66; }
.ok{ color:#39ff14; }

/* ===== TIERED THUMBS ===== */
.tier-line{
  height:2px;
  background:rgba(57,255,20,.65);
  box-shadow:0 0 12px rgba(57,255,20,.35);
  border-radius:999px;
  margin:18px 0 10px;
}
.tier-title{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  margin:0 2px 10px;
}
.tier-title b{ color:#39ff14; letter-spacing:.06em; }
.tier-title span{ font-size:12px; opacity:.75; }

.thumb .badge{
  position:absolute;
  top:8px;
  left:8px;
  padding:4px 8px;
  font-size:11px;
  border-radius:999px;
  background:rgba(15,19,24,.85);
  border:1px solid rgba(57,255,20,.45);
  color:#39ff14;
  backdrop-filter: blur(6px);
}
.thumb.decided{ opacity:.72; }
.thumb .tbd{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  letter-spacing:.08em;
  color:rgba(229,231,235,.85);
  background:linear-gradient(135deg, rgba(15,19,24,.92), rgba(15,19,24,.65));
  text-shadow:0 0 10px rgba(0,0,0,.55);
}
.thumb .dim{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.15);
  pointer-events:none;
}

/* used by champion-overlay.js */
.hidden{display:none!important;}
</style>
</head>

<body>
<div class="wrap">

<h1>ART BATTLE. Faction I.</h1>

<div class="timer">—</div>

<div class="topbar">
  <button class="btn" id="btnBack">← Menu</button>
  <div class="pill" id="roundLabel">Loading…</div>
  <div style="display:flex; gap:8px; align-items:center;">
    <div class="pill" id="userLabel">Not signed in</div>
    <button class="btn" id="btnSignIn">Sign in</button>
    <button class="btn" id="btnSignOut" disabled>Sign out</button>
  </div>
</div>

<div class="small" id="statusLine"></div>

<div class="card">
  <div class="imgBox">
    <img id="imgLeft" alt="Active top">
    <div class="decidedOverlay" id="decidedOverlayTop">
      WINNER DECIDED
      <small>Pick another matchup below</small>
    </div>
  </div>
  <div class="bar">
    <span>Top</span>
    <span id="countLeft">0</span>
    <button class="vote" id="voteLeft" disabled>Vote</button>
  </div>
</div>

<div class="card">
  <div class="imgBox">
    <img id="imgRight" alt="Active bottom">
    <div class="decidedOverlay" id="decidedOverlayBottom">
      WINNER DECIDED
      <small>Moved to next battle</small>
    </div>
  </div>
  <div class="bar">
    <span>Bottom</span>
    <span id="countRight">0</span>
    <button class="vote" id="voteRight" disabled>Vote</button>
  </div>
</div>

<div class="thumbs" id="thumbs"></div>

</div>

<!-- IMPORTANT: put your overlay file here: /js/champion-overlay.js -->
<script src="js/champion-overlay.js"></script>

<script type="module">

const SUPABASE_URL = "https://tuqvpcevrhciursxrgav.supabase.co";
const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1cXZwY2V2cmhjaXVyc3hyZ2F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1MDA0NDQsImV4cCI6MjA3MjA3NjQ0NH0.JbIWJmioBNB_hN9nrLXX83u4OazV49UokvTjNB6xa_Y";

/* IMPORTANT: set this to YOUR bucket name if your DB stores paths instead of full URLs */
const PUBLIC_BUCKET = "submissions";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Back to menu
const btnBack = document.getElementById("btnBack");
if (btnBack) btnBack.onclick = () => { window.location.href = "menu.html"; };

/* =========================
   URL "REPAIR" (fix broken thumbnails)
   - If DB stores full http(s) URL -> unchanged
   - If DB stores /storage/v1/object/public/... -> prefix SUPABASE_URL
   - If DB stores "folder/file.png" -> assume it lives in PUBLIC_BUCKET
========================= */
function resolveImgUrl(v){
  if (!v) return null;
  if (typeof v !== "string") return v;

  const s = v.trim();
  if (!s) return null;

  if (s.startsWith("http://") || s.startsWith("https://")) return s;

  // already looks like a storage path
  if (s.startsWith("/storage/v1/object/public/")) return SUPABASE_URL + s;

  if (s.includes("storage/v1/object/public/")) {
    // missing leading slash or domain
    const i = s.indexOf("storage/v1/object/public/");
    return SUPABASE_URL + "/" + s.slice(i);
  }

  // plain path -> assume public bucket path
  return `${SUPABASE_URL}/storage/v1/object/public/${PUBLIC_BUCKET}/${s}`;
}

/* =========================
   DOM
========================= */
const imgLeft = document.getElementById("imgLeft");
const imgRight = document.getElementById("imgRight");
const decidedOverlayTop = document.getElementById("decidedOverlayTop");
const decidedOverlayBottom = document.getElementById("decidedOverlayBottom");
const countLeft = document.getElementById("countLeft");
const countRight = document.getElementById("countRight");
const voteLeft = document.getElementById("voteLeft");
const voteRight = document.getElementById("voteRight");
const thumbsEl = document.getElementById("thumbs");
const roundLabel = document.getElementById("roundLabel");
const userLabel = document.getElementById("userLabel");
const statusLine = document.getElementById("statusLine");
const btnSignIn = document.getElementById("btnSignIn");
const btnSignOut = document.getElementById("btnSignOut");

/* =========================
   STATE
========================= */
let sessionUser = null;
let activeRound = 0;

// All rounds, padded with placeholders so we can show TBD slots
let rounds = [[],[],[],[],[]];

// Current viewed match (can be any round)
let viewRound = 0;
let viewMatchIndex = 0;

// voted matches for user (all rounds)
let votedMatchIds = new Set();

let keepCurrentMatch = false;
let jumpAfterDecideFrom = null;

// NEW: Track if champion overlay was shown this session
let championShown = false;

// NEW: Track if we already triggered a reset to avoid infinite loops
let resetTriggered = false;

/* =========================
   CONSTANTS
========================= */
const ROUND_NAMES = ["R32","R16","Quarterfinals","Semifinals","Final"];
const ROUND_COUNTS = [16, 8, 4, 2, 1];

/* =========================
   AUTH
========================= */
btnSignIn.onclick = async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.href }
  });
  if (error) {
    console.error("Sign in error:", error);
    setStatus("Sign-in failed: " + error.message, "warn");
  }
};

btnSignOut.onclick = async () => {
  const { error } = await supabase.auth.signOut();
  if (error) {
    console.error("Sign out error:", error);
    setStatus("Sign-out failed: " + error.message, "warn");
  } else {
    sessionUser = null;
    votedMatchIds.clear();
    await refreshAll();
  }
};

function updateAuthUI(){
  if (sessionUser){
    userLabel.textContent = sessionUser.email ?? "Signed in";
    btnSignIn.disabled = true;
    btnSignOut.disabled = false;
  } else {
    userLabel.textContent = "Not signed in";
    btnSignIn.disabled = false;
    btnSignOut.disabled = true;
  }
}

/* =========================
   LOAD
========================= */
async function loadAllRounds(){
  const { data, error } = await supabase
    .from("round_matches_v2")
    .select("*")
    .order("round", { ascending: true })
    .order("match_index", { ascending: true });

  if (error){
    console.error(error);
    return [[],[],[],[],[]];
  }

  const out = [[],[],[],[],[]];
  for (const m of (data ?? [])){
    const r = m.round ?? 0;
    if (r >= 0 && r <= 4) out[r].push(m);
  }

  for (let r = 0; r < 5; r++){
    const needed = ROUND_COUNTS[r];
    while (out[r].length < needed){
      out[r].push({ id: null, winner_img: null });
    }
  }

  return out;
}

async function detectActiveRound(){
  const { data, error } = await supabase.rpc("get_active_round_v2");
  if (error || data == null){
    console.warn("get_active_round_v2 error:", error);
    return 0;
  }
  return data;
}

async function loadUserVotedMatchIds(userId){
  if (!userId) return new Set();
  const { data, error } = await supabase
    .from("round_votes_v2")
    .select("match_id")
    .eq("user_id", userId);

  if (error){
    console.warn("loadUserVotedMatchIds error:", error);
    return new Set();
  }

  return new Set((data ?? []).map(v => v.match_id));
}

async function loadCounts(matchId){
  if (!matchId) return { l:0, r:0 };

  const { data, error } = await supabase
    .from("round_votes_v2")
    .select("side")
    .eq("match_id", matchId);

  if (error){
    console.warn("loadCounts error:", error);
    return { l:0, r:0 };
  }

  let l = 0, r = 0;
  for (const v of (data ?? [])){
    if (v.side === "left") l++;
    else if (v.side === "right") r++;
  }

  return { l, r };
}

function setStatus(msg, cls){
  statusLine.textContent = msg;
  statusLine.className = "small " + (cls ?? "");
}

function getViewedMatch(){
  const arr = rounds?.[viewRound] ?? [];
  return arr[viewMatchIndex] ?? null;
}

/* =========================
   IMAGE HELPERS
========================= */
function bestLeftImg(m){
  return resolveImgUrl(m?.left_img ?? m?.top_img ?? null);
}
function bestRightImg(m){
  return resolveImgUrl(m?.right_img ?? m?.bottom_img ?? null);
}
function bestWinnerImg(m){
  return resolveImgUrl(m?.winner_img ?? null);
}

/* =========================
   RENDER
========================= */
function render(){
  const m = getViewedMatch();
  roundLabel.textContent = m?.id
    ? `${ROUND_NAMES[viewRound]} – Match ${viewMatchIndex + 1}`
    : `${ROUND_NAMES[viewRound]} – TBD`;

  if (!m || !m.id){
    imgLeft.src = "";
    imgRight.src = "";
    decidedOverlayTop.style.display = "none";
    decidedOverlayBottom.style.display = "none";
    voteLeft.disabled = true;
    voteRight.disabled = true;
    renderThumbs();
    return;
  }

  const L = bestLeftImg(m);
  const R = bestRightImg(m);
  const W = bestWinnerImg(m);

  imgLeft.src = L || "";
  imgRight.src = R || "";

  const isDecided = !!W;

  if (isDecided){
    decidedOverlayTop.style.display = "flex";
    decidedOverlayBottom.style.display = "flex";
    voteLeft.disabled = true;
    voteRight.disabled = true;
  } else {
    decidedOverlayTop.style.display = "none";
    decidedOverlayBottom.style.display = "none";

    const canVote = !!(sessionUser && L && R && !votedMatchIds.has(m.id));
    voteLeft.disabled = !canVote;
    voteRight.disabled = !canVote;
  }

  renderThumbs();
}

function thumbHTML(m){
  const L = bestLeftImg(m);
  const R = bestRightImg(m);
  const W = bestWinnerImg(m);

  if (!m.id){
    return `<div class="thumb-img"><div class="tbd">TBD</div></div>`;
  }

  const isDecided = !!W;

  if (isDecided){
    return `
      <div class="badge">DECIDED</div>
      <div class="thumb-img">
        <img class="full" src="${W}" alt="Winner" />
        <div class="dim"></div>
      </div>
    `;
  }

  if (L && R){
    return `
      <div class="thumb-img">
        <img class="left" src="${L}" alt="Left" />
        <img class="right" src="${R}" alt="Right" />
      </div>
    `;
  }

  if (L){
    return `
      <div class="thumb-img">
        <img class="full" src="${L}" alt="Only left" />
      </div>
    `;
  }

  if (R){
    return `
      <div class="thumb-img">
        <img class="full" src="${R}" alt="Only right" />
      </div>
    `;
  }

  return `<div class="thumb-img"><div class="tbd">TBD</div></div>`;
}

function renderThumbs(){
  thumbsEl.innerHTML = "";

  for (let r = 0; r < 5; r++){
    if (!rounds[r] || !rounds[r].length) continue;

    const line = document.createElement("div");
    line.className = "tier-line";
    thumbsEl.appendChild(line);

    const title = document.createElement("div");
    title.className = "tier-title";
    title.innerHTML = `<b>${ROUND_NAMES[r]}</b><span>${ROUND_COUNTS[r]} matches</span>`;
    thumbsEl.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "thumbs";
    grid.style.marginTop = "0";

    (rounds[r] ?? []).forEach((m, i) => {
      const t = document.createElement("div");
      const isActive = (r === viewRound && i === viewMatchIndex);
      const isDecided = !!m.winner_img;

      t.className = "thumb" + (isActive ? " active" : "") + (isDecided ? " decided" : "");
      t.innerHTML = thumbHTML(m);

      t.onclick = async () => {
        viewRound = r;
        viewMatchIndex = i;
        await refreshCounts();
        render();
        updateStatusLine();
      };

      grid.appendChild(t);
    });

    thumbsEl.appendChild(grid);
  }
}

async function refreshCounts(){
  const m = getViewedMatch();
  if (!m?.id){
    countLeft.textContent = "0";
    countRight.textContent = "0";
    return;
  }
  const c = await loadCounts(m.id);
  countLeft.textContent = c.l;
  countRight.textContent = c.r;
}

function updateStatusLine(){
  if (!sessionUser){
    setStatus("Sign in to vote. (You can vote once per match.)");
    return;
  }

  const m = getViewedMatch();
  if (!m){
    setStatus("No matchup selected.", "warn");
    return;
  }

  if (!m.id){
    setStatus("This slot hasn't been created yet. (Waiting for winners to advance.)", "warn");
    return;
  }

  const L = bestLeftImg(m);
  const R = bestRightImg(m);

  if (!L || !R){
    setStatus("Waiting for an opponent (TBD). Voting unlocks once both sides are ready.", "warn");
    return;
  }

  if (m.winner_img){
    setStatus("WINNER DECIDED. This match is locked.", "warn");
    return;
  }

  if (votedMatchIds.has(m.id)){
    setStatus("You already voted in THIS matchup. You can vote in other matchups.", "warn");
    return;
  }

  setStatus("You can vote once in this matchup.", "ok");
}

/* =========================
   CHAMPION OVERLAY & RESET
========================= */
function maybeShowChampionOverlay(){
  // Final is round 4, match 0
  const finalMatch = rounds?.[4]?.[0];
  if (!finalMatch?.winner_img) return;

  // Only show once per load (until reset)
  if (championShown) return;

  // Needs overlay script loaded
  if (typeof window.openChampionOverlay !== "function") {
    console.warn("Champion overlay script not loaded (openChampionOverlay missing).");
    return;
  }

  championShown = true;

  // If you later store artist usernames / seeds, put them in this label.
  const label = "Faction I Champion";
  window.openChampionOverlay(label, finalMatch.winner_img);
  
  // NEW: Schedule the reset after showing the champion
  // The overlay will stay visible until user closes it
  scheduleReset();
}

/* =========================
   NEW: RESET TOURNAMENT
========================= */
async function scheduleReset(){
  // Prevent multiple reset calls
  if (resetTriggered) return;
  resetTriggered = true;
  
  console.log("Tournament complete - scheduling reset...");
  
  // Small delay to ensure overlay is displayed first
  setTimeout(async () => {
    await resetTournament();
  }, 1000);
}

async function resetTournament(){
  try {
    console.log("Resetting tournament votes...");
    
    // Delete all votes from round_votes_v2 table
    const { error: deleteError } = await supabase
      .from("round_votes_v2")
      .delete()
      .neq("id", 0); // This deletes all rows (neq with impossible condition)
    
    if (deleteError) {
      console.error("Error deleting votes:", deleteError);
      setStatus("Reset failed: " + deleteError.message, "warn");
      return;
    }
    
    // Reset all matches to remove winners (set winner_img to null)
    const { error: resetError } = await supabase
      .from("round_matches_v2")
      .update({ winner_img: null })
      .neq("id", 0); // Update all rows
    
    if (resetError) {
      console.error("Error resetting matches:", resetError);
      setStatus("Reset failed: " + resetError.message, "warn");
      return;
    }
    
    console.log("Tournament reset complete! Reloading data...");
    
    // Clear local state
    votedMatchIds.clear();
    resetTriggered = false; // Allow future resets
    // NOTE: We keep championShown = true so overlay stays visible
    
    // Reload all data and go back to R32
    viewRound = 0;
    viewMatchIndex = 0;
    await refreshAll();
    
    setStatus("Tournament reset! Starting fresh from R32.", "ok");
    
  } catch (e) {
    console.error("Reset tournament error:", e);
    setStatus("Reset crashed: " + (e?.message ?? e), "warn");
  }
}

/* =========================
   ADVANCE
========================= */
async function tryAutoAdvanceIfReady(matchId){
  if (!matchId) return false;
  try{
    const { error } = await supabase.rpc("advance_match_v2", { p_match_id: matchId });
    if (error){
      console.warn("advance_match_v2 error:", error);
      setStatus("Advance RPC failed: " + error.message, "warn");
      return false;
    }
    return true;
  } catch(e){
    console.warn("advance_match_v2 crash:", e);
    setStatus("Advance RPC crashed: " + (e?.message ?? e), "warn");
    return false;
  }
}

/* =========================
   HELPERS: JUMP TO NEXT BATTLE
========================= */
function pickNextUnfinishedIndexInRound(r, startAfterIndex){
  const arr = rounds?.[r] ?? [];
  if (!arr.length) return 0;

  for (let i = (startAfterIndex + 1); i < arr.length; i++){
    const m = arr[i];
    if (m?.id && !m.winner_img) return i;
  }

  const first = arr.findIndex(m => m?.id && !m.winner_img);
  return first >= 0 ? first : 0;
}

/* =========================
   VOTE
========================= */
async function castVote(side){
  const m = getViewedMatch();
  if (!m || !sessionUser) return;

  if (!m.id){
    setStatus("This match hasn't been created yet.", "warn");
    return;
  }

  if (votedMatchIds.has(m.id)){
    setStatus("Already voted in this matchup.", "warn");
    return;
  }

  setStatus("Submitting vote…");

  const { error } = await supabase
    .from("round_votes_v2")
    .insert({
      user_id: sessionUser.id,
      round: viewRound,
      match_id: m.id,
      side
    });

  if (error){
    if (String(error.code) === "23505"){
      votedMatchIds.add(m.id);
      setStatus("Already voted in this matchup (DB enforced).", "warn");
      keepCurrentMatch = true;
      await refreshAll();
      return;
    }
    setStatus("Vote failed: " + error.message, "warn");
    return;
  }

  votedMatchIds.add(m.id);

  // update counts immediately
  let cNow = null;
  try{
    cNow = await loadCounts(m.id);
    countLeft.textContent = cNow.l;
    countRight.textContent = cNow.r;
  } catch(e){
    console.warn("count refresh after vote failed:", e);
  }

  const isNowDecidedByCount = !!(cNow && (cNow.l >= 2 || cNow.r >= 2));

  if (isNowDecidedByCount){
    setStatus("Winner decided — advancing and moving to next battle…", "ok");
    jumpAfterDecideFrom = { round: viewRound, index: viewMatchIndex };
    keepCurrentMatch = false;

    const ok = await tryAutoAdvanceIfReady(m.id);
    if (!ok){
      keepCurrentMatch = true;
      jumpAfterDecideFrom = null;
      setStatus("Vote saved, but advance failed — staying on this match.", "warn");
    }
  } else {
    keepCurrentMatch = true;
    setStatus("Vote submitted.", "ok");
  }

  await refreshAll();
}

voteLeft.onclick=()=>castVote("left");
voteRight.onclick=()=>castVote("right");

/* =========================
   REFRESH
========================= */
async function refreshAll(){
  try{
    const { data: sess, error: sessErr } = await supabase.auth.getSession();
    if (sessErr) throw sessErr;

    sessionUser = sess?.session?.user ?? null;
    updateAuthUI();

    const prev = keepCurrentMatch ? {
      round: viewRound,
      id: getViewedMatch()?.id ?? null,
      idx: viewMatchIndex
    } : null;

    activeRound = await detectActiveRound();
    rounds = await loadAllRounds();
    maybeShowChampionOverlay();
    votedMatchIds = await loadUserVotedMatchIds(sessionUser?.id);

    if (!prev && jumpAfterDecideFrom){
      viewRound = jumpAfterDecideFrom.round;
      viewMatchIndex = pickNextUnfinishedIndexInRound(viewRound, jumpAfterDecideFrom.index);
      jumpAfterDecideFrom = null;
      keepCurrentMatch = false;
    }
    else if (!prev){
      viewRound = activeRound;
      const firstUnfinished = (rounds[activeRound] ?? []).findIndex(m => m?.id && !m.winner_img);
      viewMatchIndex = firstUnfinished >= 0 ? firstUnfinished : 0;
    } else {
      if (prev.id){
        const idx = (rounds[prev.round] ?? []).findIndex(mm => mm?.id === prev.id);
        if (idx >= 0){
          viewRound = prev.round;
          viewMatchIndex = idx;
        } else {
          viewRound = prev.round;
          viewMatchIndex = Math.min(prev.idx ?? 0, (rounds[prev.round]?.length ?? 1) - 1);
        }
      } else {
        viewRound = prev.round;
        viewMatchIndex = Math.min(prev.idx ?? 0, (rounds[prev.round]?.length ?? 1) - 1);
      }
      keepCurrentMatch = false;
    }

    render();
    await refreshCounts();
    updateStatusLine();
  } catch(e){
    console.error(e);
    setStatus("Load error: " + (e?.message ?? e), "warn");
  }
}

await refreshAll();
</script>
